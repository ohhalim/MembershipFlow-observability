apiVersion: 1

groups:
  - orgId: 1
    name: batch-heartbeat
    folder: Batch Heartbeat
    interval: 5m
    rules:
      - uid: collect-batch-stale
        title: "시세 수집 배치 26시간 이상 미실행"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'time() - max by (instance, job) ({__name__=~"collect_last_run_timestamp_seconds|process_start_time_seconds", job="membershipflow-backend"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [93600]
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          ai_analyze: "true"
          service: MembershipFlow
          environment: production
          severity: critical
          route: collect-batch
        annotations:
          summary: "collect_last_run_timestamp_seconds 26시간 초과 미갱신"

      - uid: billing-batch-stale
        title: "정기결제 배치 26시간 이상 미실행"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'time() - max by (instance, job) ({__name__=~"billing_last_run_timestamp_seconds|process_start_time_seconds", job="membershipflow-backend"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [93600]
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          ai_analyze: "true"
          service: MembershipFlow
          environment: production
          severity: critical
          route: billing-batch
        annotations:
          summary: "billing_last_run_timestamp_seconds 26시간 초과 미갱신"
