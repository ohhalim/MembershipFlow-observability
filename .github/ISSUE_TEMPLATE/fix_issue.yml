name: 버그 수정 (Fix)
description: 관찰·배포 시스템 오류 수정
title: "[Fix]: "
labels: [fix]
body:
  - type: input
    id: branch_keyword
    attributes:
      label: Branch Keyword
      description: 영문 소문자 키워드
      placeholder: alert-delivery
    validations:
      required: true

  - type: textarea
    id: observation
    attributes:
      label: 관측값
      description: 오류 메시지, 지표, 로그, 재현 조건
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 변경 범위
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 계획
      value: |
        - [ ] 오류 조건 재현
        - [ ] 단위·통합 테스트
        - [ ] 배포 후 경로 검증

