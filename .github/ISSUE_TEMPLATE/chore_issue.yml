name: 운영 작업 (Chore)
description: 배포·문서·의존성·운영 설정 작업
title: "[Chore]: "
labels: [chore]
body:
  - type: input
    id: branch_keyword
    attributes:
      label: Branch Keyword
      description: 영문 소문자 키워드
      placeholder: dependency-update
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 현재 구조와 작업 필요 근거
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 계획
    validations:
      required: true
