name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

jobs:
  verify:
    name: Flow · Python · Compose · Prometheus
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      APP_SERVER_PRIVATE_IP: 10.0.0.10
      MONITORING_DB_ROOT_PASSWORD: ci-root-password
      INCIDENT_DB_RUNTIME_PASSWORD: ci-runtime-password
      INCIDENT_DB_MIGRATION_PASSWORD: ci-migration-password
      INCIDENT_WEBHOOK_SECRET: ci-webhook-secret-change-me
      GEMINI_API_KEY: ci-placeholder
      LLM_MODEL: gemini-test
      SLACK_WEBHOOK_URL: https://hooks.slack.invalid/services/test
      GRAFANA_PASSWORD: ci-grafana-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PR 브랜치 흐름 검증
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/validate-pr-flow.sh "${{ github.base_ref }}" "${{ github.head_ref }}"

      - name: Shell syntax
        run: |
          bash -n .github/scripts/*.sh incident-analyzer/scripts/*.sh
          bash .github/scripts/wait-for-incident-health-test.sh


      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: incident-analyzer/requirements-dev.lock

      - name: Install dependencies
        working-directory: incident-analyzer
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint and test
        working-directory: incident-analyzer
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
          pytest

      - name: Compose configuration
        run: docker compose config -q

      - name: Prometheus configuration and rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Incident analyzer image build
        run: docker build -t membershipflow-incident-analyzer:ci incident-analyzer
